<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장기요양보험 통합 계산기</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>🏥 장기요양보험 계산기</h2>

      <div class="tab-group">
        <button class="tab-btn active" onclick="switchTab('client')">
          보호자용 (본인부담금)
        </button>
        <button class="tab-btn" onclick="switchTab('institution')">
          원장님용 (인건비/가감산)
        </button>
      </div>

      <div class="card">
        <!-- 탭 1: 보호자용 -->
        <div id="tab-client" class="tab-content active">
          <h3>어르신 등급별 수가 및 본인부담금</h3>
          <div class="form-group">
            <label>장기요양 등급</label>
            <select id="client-grade">
              <option value="1">1등급</option>
              <option value="2">2등급</option>
              <option value="3">3등급</option>
              <option value="4">4등급</option>
              <option value="5">5등급</option>
            </select>
          </div>
          <div class="form-group">
            <label>본인부담율</label>
            <select id="client-rate">
              <option value="NORMAL_15">일반 (15%)</option>
              <option value="REDUCED_9">감경 (9%)</option>
              <option value="REDUCED_6">감경 (6%)</option>
              <option value="BASIC_0">기초생활수급자 (0%)</option>
            </select>
          </div>
          <button class="submit-btn" onclick="calculateClient()">
            본인부담금 계산하기
          </button>

          <div id="client-result" class="result-box">
            <div class="result-item">
              <span>월 인정 한도액:</span><span id="res-max-amount">0원</span>
            </div>
            <div class="result-item total">
              <span>예상 본인부담금:</span><span id="res-copay">0원</span>
            </div>
          </div>
        </div>

        <!-- 탭 2: 원장님용 -->
        <div id="tab-institution" class="tab-content">
          <h3>기관 인건비 비율 & 배치 가감산 산출</h3>

          <div class="form-group">
            <label>시설 유형</label>
            <select id="inst-type">
              <option value="daycare">주야간보호 (지출 의무비율 48.4%)</option>
              <option value="homecare">방문요양 (지출 의무비율 86.6%)</option>
            </select>
          </div>

          <label>이용 어르신 수 (명)</label>
          <div class="grid-2 form-group">
            <input
              type="number"
              id="count-g12"
              placeholder="1~2등급 인원"
              value="5"
            />
            <input
              type="number"
              id="count-g35"
              placeholder="3~5등급 인원"
              value="15"
            />
          </div>

          <label>근무 직원 수 (명)</label>
          <div class="grid-2 form-group">
            <input
              type="number"
              id="staff-caregiver"
              placeholder="요양보호사 수"
              value="3"
            />
            <input
              type="number"
              id="staff-nurse"
              placeholder="간호(조무)사 수"
              value="1"
            />
          </div>

          <div class="form-group">
            <label>이번 달 지급 총 인건비 (원)</label>
            <input
              type="number"
              id="total-payroll"
              placeholder="기본급+수당+4대보험 사업자분 포함"
              value="15000000"
            />
          </div>

          <button class="submit-btn" onclick="calculateInstitution()">
            인건비율 및 가감산 검증
          </button>

          <div id="inst-result" class="result-box">
            <div class="result-item">
              <span>예상 총 급여비용(수가):</span
              ><span id="res-total-revenue">0원</span>
            </div>
            <div class="result-item">
              <span>인력 배치 검증:</span>
              <span id="res-staff-status" class="status-badge">검증 전</span>
            </div>
            <div class="result-item">
              <span>현재 인건비 지출 비율:</span
              ><span id="res-payroll-ratio">0%</span>
            </div>
            <div class="result-item total">
              <span>인건비 비율 충족 여부:</span>
              <span id="res-ratio-status" class="status-badge">검증 전</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
